<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" class="mascot-v2 state-idle" role="img" aria-label="Naqsh mascot">
  <style>
    .mascot-v2 { --rose:#e07c7b; --brick:#a94a4a; --ink:#1b1b1f; --cream:#f3eee8; }
    .mascot-v2 .face-part { display:none; }
    .mascot-v2 .eye, .mascot-v2 .mouth { fill:none; stroke:var(--ink); stroke-width:2; stroke-linecap:round; }
    .mascot-v2 .eye-dot { fill:var(--ink); stroke:none; }
    .mascot-v2 .mouth-fill { fill:var(--ink); stroke:none; }
    .mascot-v2 .rig { transform-origin:32px 58px; }
    .mascot-v2 .body { transform-origin:32px 56px; }
    .mascot-v2 .head { transform-origin:32px 32px; }
    .mascot-v2 .top { transform-origin:32px 27px; }
    .mascot-v2 .face { transform-origin:32px 44px; }
    .mascot-v2 .motion-line { opacity:0; stroke:var(--ink); stroke-width:1.4; stroke-linecap:round; }

    /* shared motion */
    @keyframes breathe { 0%,100% { transform:scale(1,1); } 50% { transform:scale(1.018,.982); } }
    @keyframes lag { 0%,100% { transform:translateY(0) rotate(0); } 50% { transform:translateY(-.7px) rotate(-1.5deg); } }
    @keyframes bob { 0%,100% { transform:translateY(0) scale(1,1); } 25% { transform:translateY(-.8px) scale(1.01,.99); } 50% { transform:translateY(0) scale(.995,1.005); } 75% { transform:translateY(-.4px) scale(1,.998); } }
    @keyframes headtilt { 0%,100% { transform:rotate(0); } 30% { transform:rotate(-3deg); } 65% { transform:rotate(1.5deg); } }
    @keyframes shake { 0%,100% { transform:translateX(0) rotate(0); } 25% { transform:translateX(-1.2px) rotate(-1.5deg); } 50% { transform:translateX(1.2px) rotate(1.2deg); } 75% { transform:translateX(-.6px) rotate(-.6deg); } }
    @keyframes squash { 0%,100% { transform:scale(1,1); } 20% { transform:scale(1.08,.92); } 45% { transform:scale(.96,1.05); } 70% { transform:scale(1.02,.99); } }
    @keyframes jump { 0%,100% { transform:translateY(0) scale(1,1); } 15% { transform:translateY(1px) scale(1.06,.94); } 40% { transform:translateY(-5px) scale(.97,1.04); } 70% { transform:translateY(0) scale(1.04,.96); } }
    @keyframes rock { 0%,100% { transform:rotate(0); } 20% { transform:rotate(-10deg); } 40% { transform:rotate(8deg); } 60% { transform:rotate(-6deg); } 80% { transform:rotate(3deg); } }
    @keyframes droop { 0%,100% { transform:translateY(0) rotate(0); } 40% { transform:translateY(1.2px) rotate(2.5deg); } 75% { transform:translateY(.7px) rotate(1.4deg); } }
    @keyframes proud { 0%,100% { transform:scale(1,1); } 35% { transform:scale(1.06,1.03); } 70% { transform:scale(1.01,1); } }
    @keyframes blink { 0%,40%,100% { transform:scaleY(1); } 50%,62% { transform:scaleY(.1); } 72% { transform:scaleY(1); } }
    @keyframes dots { 0%,100% { opacity:0; } 25%,60% { opacity:1; } }
    @keyframes gaze-up { 0%,100% { transform:translateY(-1px); } 50% { transform:translateY(-1.6px); } }
    @keyframes gaze-down { 0%,100% { transform:translateY(1.2px); } 50% { transform:translateY(1.6px); } }
    @keyframes type { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-.9px); } }
    @keyframes line-in { 0%,15% { opacity:0; } 25%,75% { opacity:.8; } 90%,100% { opacity:0; } }

    /* face defaults per state */
    .state-idle .eyes-open, .state-idle .mouth-smile { display:inline; }
    .state-blink .eyes-closed, .state-blink .mouth-smile { display:inline; }
    .state-talking .eyes-open, .state-talking .mouth-smile { display:inline; }
    .state-thinking .eyes-open, .state-thinking .mouth-flat { display:inline; }
    .state-curious .eyes-open, .state-curious .mouth-smile { display:inline; }
    .state-surprised .eyes-wide, .state-surprised .mouth-o { display:inline; }
    .state-confused .eyes-half, .state-confused .mouth-flat { display:inline; }
    .state-happy .eyes-closed, .state-happy .mouth-smile { display:inline; }
    .state-excited .eyes-closed, .state-excited .mouth-open { display:inline; }
    .state-laughing .eyes-closed, .state-laughing .mouth-laugh { display:inline; }
    .state-proud .eyes-closed, .state-proud .mouth-smile { display:inline; }
    .state-sad .eyes-sad, .state-sad .mouth-frown { display:inline; }
    .state-sleepy .eyes-half, .state-sleepy .mouth-flat { display:inline; }
    .state-wave-hello .eyes-open, .state-wave-hello .mouth-smile { display:inline; }
    .state-wave-goodbye .eyes-open, .state-wave-goodbye .mouth-smile { display:inline; }
    .state-working .eyes-open, .state-working .mouth-flat { display:inline; }

    /* animations per state */
    .state-idle .body { animation:none; }
    .state-idle .top { animation:lag 1.5s ease-in-out infinite; }
    .state-blink .eyes-open { animation:none; }
    .state-blink .eyes-closed { display:inline; animation:blink 1s ease-in-out 1; }
    .state-talking .body { animation:bob .375s ease-in-out infinite; }
    .state-talking .head { animation:headtilt 1.5s ease-in-out infinite; }
    .state-talking .top { animation:lag .75s ease-in-out infinite; }
    .state-thinking .head { animation:headtilt 1.5s ease-in-out infinite; }
    .state-thinking .face { animation:gaze-up 1.5s ease-in-out infinite; }
    .state-thinking .think-dot { display:inline; animation:dots 1.5s steps(1,end) infinite; }
    .state-thinking .top { animation:lag 1.5s ease-in-out infinite; }
    .state-curious .head { animation:headtilt 1s ease-in-out 1; }
    .state-curious .top { animation:lag 1s ease-in-out 1; }
    .state-surprised .body { animation:squash 1s ease-out 1; }
    .state-surprised .top { animation:lag 1s ease-out 1; }
    .state-confused .head { animation:shake 1s ease-in-out 1; }
    .state-happy .body { animation:jump 1s ease-out 1; }
    .state-happy .top { animation:lag 1s ease-out 1; }
    .state-excited .body { animation:jump .9s ease-out 1; }
    .state-excited .top { animation:lag .9s ease-out 1; }
    .state-laughing .body { animation:shake 1.5s ease-in-out infinite; }
    .state-laughing .head { animation:headtilt 1.5s ease-in-out infinite; }
    .state-laughing .top { animation:lag .75s ease-in-out infinite; }
    .state-proud .body { animation:proud 1s ease-out 1; }
    .state-proud .top { animation:lag 1s ease-out 1; }
    .state-sad .body { animation:droop 1s ease-in-out 1; }
    .state-sad .top { animation:lag 1s ease-in-out 1; }
    .state-sleepy .body { animation:none; }
    .state-sleepy .top { animation:lag 1.5s ease-in-out infinite; }
    .state-sleepy .sleep-dot { display:inline; animation:dots 1.5s steps(1,end) infinite; }
    .state-wave-hello .top { animation:rock 1s ease-in-out 1; }
    .state-wave-hello .body { animation:headtilt 1s ease-in-out 1; }
    .state-wave-goodbye .top { animation:rock 1s ease-in-out 1 reverse; }
    .state-wave-goodbye .body { animation:headtilt 1s ease-in-out 1; }
    .state-working .body { animation:type .75s ease-in-out infinite; }
    .state-working .face { animation:gaze-down .75s ease-in-out infinite; }
    .state-working .motion-line { animation:line-in .75s steps(1,end) infinite; }

    /* talking mouth: 5 shapes cycling at 12 fps (1.5 s) */
    .state-talking .mouth-smile { display:none; }
    .state-talking .talk-mouth { display:inline; opacity:0; }
    @keyframes talk1 { 0%,18% { opacity:1; } 20%,100% { opacity:0; } }
    @keyframes talk2 { 0%,20% { opacity:0; } 22%,38% { opacity:1; } 40%,100% { opacity:0; } }
    @keyframes talk3 { 0%,40% { opacity:0; } 42%,58% { opacity:1; } 60%,100% { opacity:0; } }
    @keyframes talk4 { 0%,60% { opacity:0; } 62%,78% { opacity:1; } 80%,100% { opacity:0; } }
    @keyframes talk5 { 0%,80% { opacity:0; } 82%,98% { opacity:1; } 100% { opacity:0; } }
    .state-talking .talk-1 { animation:talk1 1.5s steps(1,end) infinite; }
    .state-talking .talk-2 { animation:talk2 1.5s steps(1,end) infinite; }
    .state-talking .talk-3 { animation:talk3 1.5s steps(1,end) infinite; }
    .state-talking .talk-4 { animation:talk4 1.5s steps(1,end) infinite; }
    .state-talking .talk-5 { animation:talk5 1.5s steps(1,end) infinite; }

    @media (prefers-reduced-motion: reduce) {
      .mascot-v2 * { animation:none !important; }
    }
  </style>

  <g class="rig">
    <g class="body">
      <path class="bottom-pebble" d="M7.5 36.5c0-9.6 9.6-15.5 24.5-15.5s24.5 5.9 24.5 15.5c0 11.6-9.6 20-24.5 20S7.5 48.1 7.5 36.5Z" fill="var(--rose)" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round"/>
      <g class="head">
        <path class="top" d="M21.5 23.5c0-6.6 4.6-10.5 10.5-10.5s10.5 3.9 10.5 10.5c0 5.9-4.6 9.6-10.5 9.6s-10.5-3.7-10.5-9.6Z" fill="var(--brick)" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round"/>
      </g>

      <g class="think-dot face-part"><circle cx="44" cy="10" r="1.5" fill="var(--brick)"/><circle cx="48" cy="7" r="1.2" fill="var(--brick)"/><circle cx="52" cy="5" r="1" fill="var(--brick)"/></g>
      <g class="sleep-dot face-part"><circle cx="45" cy="12" r="1.2" fill="var(--ink)" opacity=".55"/><circle cx="49" cy="8" r="1" fill="var(--ink)" opacity=".35"/></g>

      <g class="face">
        <g class="eyes-open face-part">
          <circle class="eye-dot" cx="24" cy="43" r="2.1"/><circle class="eye-dot" cx="40" cy="43" r="2.1"/>
        </g>
        <g class="eyes-wide face-part">
          <circle class="eye-dot" cx="24" cy="43" r="2.6"/><circle class="eye-dot" cx="40" cy="43" r="2.6"/>
        </g>
        <g class="eyes-closed face-part">
          <path class="eye" d="M21 43.5q3-3 6 0"/><path class="eye" d="M37 43.5q3-3 6 0"/>
        </g>
        <g class="eyes-half face-part">
          <path class="eye" d="M21.5 43h5"/><path class="eye" d="M37.5 43h5"/>
        </g>
        <g class="eyes-sad face-part">
          <circle class="eye-dot" cx="24" cy="44.5" r="1.9"/><circle class="eye-dot" cx="40" cy="44.5" r="1.9"/>
          <path class="eye" d="M21 40.5l5 1.2"/><path class="eye" d="M43 40.5l-5 1.2"/>
        </g>

        <path class="mouth mouth-smile face-part" d="M28 49.5q4 3.2 8 0"/>
        <path class="mouth mouth-flat face-part" d="M28.5 50h7"/>
        <path class="mouth mouth-o face-part" d="M32 50m-2 0a2 2.4 0 1 0 4 0a2 2.4 0 1 0-4 0"/>
        <path class="mouth mouth-open face-part" d="M28 48.5q4 5 8 0" fill="var(--ink)"/>
        <path class="mouth mouth-frown face-part" d="M28 51.5q4-3 8 0"/>
        <path class="mouth mouth-laugh face-part" d="M27 48q5 6 10 0q-5 2-10 0Z" fill="var(--ink)" stroke="var(--ink)"/>

        <g class="talk-mouth mouth-talk face-part"><path class="mouth" d="M28.5 50h7"/></g>
        <g class="talk-mouth talk-2 face-part"><path class="mouth" d="M29 49.5q3 2.2 6 0"/></g>
        <g class="talk-mouth talk-3 face-part"><path class="mouth" d="M28.5 49q3.5 3.8 7 0q-3.5 1.2-7 0Z" fill="var(--ink)"/></g>
        <g class="talk-mouth talk-4 face-part"><path class="mouth" d="M28 48.8q4 4.4 8 0" fill="var(--ink)"/></g>
        <g class="talk-mouth talk-5 face-part"><path class="mouth" d="M32 50m-2.2 0a2.2 2.8 0 1 0 4.4 0a2.2 2.8 0 1 0-4.4 0"/></g>
      </g>

      <g class="motion-line"><path d="M6 34h5"/><path d="M4 40h4"/><path d="M6 46h5"/></g>
    </g>
  </g>
</svg>
