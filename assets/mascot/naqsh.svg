<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" class="mascot-svg state-idle" role="img" aria-label="Naqsh mascot">
  <style>
    .mascot-svg { --rose: #e07c7b; --brick: #a94a4a; --ink: #1b1b1f; --cream: #f3eee8; }
    .mascot-svg .eye { fill: var(--ink); }
    .mascot-svg .eye-happy { display: none; }
    .mascot-svg .mouth-happy, .mascot-svg .mouth-sad { display: none; }
    .mascot-svg .think-dot { opacity: 0; fill: var(--brick); }

    .mascot-svg #eyes { transform-origin: 32px 43px; }
    .mascot-svg #body-bounce { transform-origin: 32px 52px; }
    .mascot-svg #top-pebble { transform-origin: 32px 32px; }
    .mascot-svg #face-gaze { transform-origin: 32px 43px; }

    /* idle: 2 s = 24 frames at 12 fps; blink frames 18-19. */
    @keyframes idle-blink {
      0%, 75%, 83%, 100% { transform: scaleY(1); }
      79% { transform: scaleY(0.12); }
    }
    @keyframes idle-bob {
      0%, 50%, 100% { transform: translateY(0); }
      25% { transform: translateY(-0.4px); }
      75% { transform: translateY(0.4px); }
    }
    .state-idle #eyes { animation: idle-blink 2s steps(1, end) infinite; }
    .state-idle #body-bounce { animation: idle-bob 2s steps(1, end) infinite; }

    /* thinking: 2 s loop; gaze up, three dots step in. */
    @keyframes think-gaze {
      0%, 100% { transform: translateY(-0.6px); }
      50% { transform: translateY(-1px); }
    }
    @keyframes think-dot {
      0%, 20% { opacity: 0; }
      25%, 90% { opacity: 1; }
      95%, 100% { opacity: 0; }
    }
    @keyframes think-dot-2 {
      0%, 40% { opacity: 0; }
      45%, 90% { opacity: 1; }
      95%, 100% { opacity: 0; }
    }
    @keyframes think-dot-3 {
      0%, 60% { opacity: 0; }
      65%, 90% { opacity: 1; }
      95%, 100% { opacity: 0; }
    }
    @keyframes think-tilt {
      0%, 100% { transform: rotate(-2deg); }
      50% { transform: rotate(2deg); }
    }
    .state-thinking #face-gaze { animation: think-gaze 2s steps(1, end) infinite; transform: translateY(-0.8px); }
    .state-thinking .think-dot { opacity: 1; }
    .state-thinking #think-1 { animation: think-dot 2s steps(1, end) infinite; }
    .state-thinking #think-2 { animation: think-dot-2 2s steps(1, end) infinite; }
    .state-thinking #think-3 { animation: think-dot-3 2s steps(1, end) infinite; }
    .state-thinking #body-bounce { animation: think-tilt 2s steps(1, end) infinite; }

    /* wave: once, 1.5 s = 18 frames; top pebble rocks in steps. */
    @keyframes wave-rock {
      0%, 100% { transform: rotate(0deg) translateY(0); }
      11% { transform: rotate(-12deg) translateY(-1px); }
      22% { transform: rotate(10deg) translateY(-1px); }
      33% { transform: rotate(-9deg) translateY(0); }
      44% { transform: rotate(7deg) translateY(0); }
      55% { transform: rotate(-4deg) translateY(0); }
      66%, 100% { transform: rotate(0deg) translateY(0); }
    }
    .state-wave #top-pebble { animation: wave-rock 1.5s steps(1, end) 1; transform: rotate(-8deg); }

    /* happy: once, 1.5 s; closed eyes + bounce. */
    @keyframes happy-bounce {
      0%, 100% { transform: translateY(0) scale(1); }
      20% { transform: translateY(-2px) scale(1.03); }
      40% { transform: translateY(0) scale(1); }
      60% { transform: translateY(-1px) scale(1.02); }
      80%, 100% { transform: translateY(0) scale(1); }
    }
    .state-happy .eye { display: none; }
    .state-happy .eye-happy, .state-happy .mouth-happy { display: inline; }
    .state-happy .mouth { display: none; }
    .state-happy #body-bounce { animation: happy-bounce 1.5s steps(1, end) 1; }

    /* sad: once, 1.5 s; eyes down, tilt, dim. */
    @keyframes sad-tilt {
      0%, 100% { transform: rotate(0deg); }
      30% { transform: rotate(-3deg); }
      60% { transform: rotate(-2deg); }
    }
    .state-sad #face-gaze { transform: translateY(1.4px); }
    .state-sad .mouth { display: none; }
    .state-sad .mouth-sad { display: inline; }
    .state-sad #body-bounce { animation: sad-tilt 1.5s steps(1, end) 1; opacity: 0.85; }

    @media (prefers-reduced-motion: reduce) {
      .mascot-svg * { animation: none !important; }
    }
  </style>

  <g id="body-bounce">
    <path id="bottom-pebble" d="M7.5 36.5c0-9.6 9.6-15.5 24.5-15.5s24.5 5.9 24.5 15.5c0 11.6-9.6 20-24.5 20S7.5 48.1 7.5 36.5Z"
          fill="var(--rose)" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round"/>
    <path id="top-pebble" d="M21.5 23.5c0-6.6 4.6-10.5 10.5-10.5s10.5 3.9 10.5 10.5c0 5.9-4.6 9.6-10.5 9.6s-10.5-3.7-10.5-9.6Z"
          fill="var(--brick)" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round"/>

    <g id="think-dots">
      <circle id="think-1" class="think-dot" cx="44" cy="10" r="1.6"/>
      <circle id="think-2" class="think-dot" cx="48" cy="7" r="1.3"/>
      <circle id="think-3" class="think-dot" cx="52" cy="5" r="1.1"/>
    </g>

    <g id="face-gaze">
      <g id="eyes">
        <circle class="eye" cx="24" cy="43" r="2.1"/>
        <circle class="eye" cx="40" cy="43" r="2.1"/>
        <path class="eye-happy" d="M21 43.5q3-3 6 0" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"/>
        <path class="eye-happy" d="M37 43.5q3-3 6 0" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"/>
      </g>
      <path class="mouth" d="M28 49.5q4 3.2 8 0" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"/>
      <path class="mouth-happy" d="M27.5 48.5q4.5 6 9 0" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"/>
      <path class="mouth-sad" d="M28 52q4-3 8 0" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>
</svg>
