# Labels for `gh label create --force` (name, color, description).
# Kept in the repo so the label set is reproducible instead of clicked by hand.
- name: "type: feature"
  color: "0e8a16"
  description: "New user-visible capability"
- name: "type: bug"
  color: "d73a4a"
  description: "Something is wrong"
- name: "type: docs"
  color: "0075ca"
  description: "Documentation only"
- name: "type: chore"
  color: "cfd3d7"
  description: "Tooling, deps, repo hygiene"
- name: "area: backend"
  color: "1d76db"
  description: "FastAPI, pipeline, model calls"
- name: "area: frontend"
  color: "5319e7"
  description: "React, editor, export UI"
- name: "area: models"
  color: "b60205"
  description: "Meta model behaviour, prompts, cost"
- name: "phase-1"
  color: "fef2c0"
  description: "Setup and API smoke tests"
- name: "gate"
  color: "fbca04"
  description: "Go/no-go evidence for a phase"
- name: "agent-ready"
  color: "0e8a16"
  description: "Scoped, testable, plan approved, no open decision"
- name: "blocked"
  color: "000000"
  description: "Waiting on a decision, a key, or another phase"
- name: "demo"
  color: "ff7619"
  description: "Affects the demo video or the X post"
